  - title: "Module 2 — Generative AI"
    short: "Generative AI"
    question: >
      How can generative AI help architects explore design possibilities while
      maintaining meaningful control and architectural judgment?
    objectives:
      - Define generative AI and explain how generative models produce new outputs from learned patterns.
      - Distinguish the major generative model approaches — GANs, VAEs, diffusion, autoregressive/transformer models — and multimodal systems that work across them.
      - Construct a structured architectural prompt and explain why one changed term can affect several visual qualities.
      - Experiment with the control hierarchy — prompt, settings and seed, reference conditioning, structural control, explicit constraints — and compare generations systematically.
      - Distinguish visual plausibility from architectural validity, and say which structured information is needed before simulation or evaluation.
      - Use a language model for text and structured output, and state where human judgment and verification remain necessary.
      - Say who is responsible for what an AI output becomes, attribute an AI contribution properly, and distinguish an AI-generated output from validated architectural evidence.
    episodes:
      - generative/2.1-generative-possibilities.md
      - generative/2.2-noise-to-design.md
      - generative/2.3-prompting-as-design.md
      - generative/2.4-control-the-generator.md
      - generative/2.5-architectural-judgment.md
      - generative/2.6-image-to-architecture.md
      - generative/2.7-guided-design-workflow.md
      - generative/2.8-llms-and-structured-generation.md
      - generative/2.9-run-a-model-locally.md
      - generative/2.10-critical-ai-in-architecture.md
    readings:
      - cite: "Jang, S., Roh, H., & Lee, G. (2025)"
        title: "Generative AI in architectural design: application, data, and evaluation methods"
        venue: "Automation in Construction, 174, 106174"
        doi: "10.1016/j.autcon.2025.106174"
        why: "Core. A PRISMA review of 161 papers (2014–2024): which models are used, in which design phases (68.94 % schematic), with which data (images dominate) and how outputs are evaluated (mostly comparative and author-judged). Read with Lessons 2.1 and 2.5."
        access: "subscription (UW Libraries)"
      - cite: "Fang, C., Zhu, Y., Fang, L., Long, Y., Lin, H., Cong, Y., & Wang, S. J. (2025)"
