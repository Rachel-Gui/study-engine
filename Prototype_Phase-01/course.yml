# Wrap any of these in {{double braces}} anywhere in any episode to get a tooltip.
glossary:
  activation function: "A nonlinear transformation applied to a neuron's weighted sum. Without one, stacked layers collapse into a single linear map."
  backpropagation: "Applying the chain rule backwards through a network to get the gradient of the loss with respect to every weight in one sweep."
  baseline: "The simplest model you compare against. If it wins, use it."
  batch: "A subset of training examples used for one weight update."
  bias: "A learned value added to the weighted sum, shifting the threshold at which a neuron responds."
  classification: "Predicting which of a fixed set of categories a case belongs to."
  cross-validation: "Estimating generalization by rotating which slice of the data is held out."
  data leakage: "When information from the test set reaches the model during training, making the reported score optimistic."
  dropout: "Randomly switching off a fraction of neurons during training so the network cannot depend on any single one."
  early stopping: "Halting training at the epoch where validation loss stopped improving, and keeping those weights."
  epoch: "One complete pass through the training dataset."
  features: "The input variables a model sees at prediction time."
  generalization: "How well a model performs on data it was not trained on. The only performance that matters."
  gnn: "Graph neural network. A neural model that passes messages between connected nodes. A graph on its own is not a GNN."
  hyperparameter: "A setting you choose rather than learn: layer count, learning rate, batch size, dropout rate."
  inr: "Implicit neural representation. Geometry or a field stored as a continuous coordinate-based function rather than a grid or mesh."
  learning rate: "The size of each weight update. Too large and training diverges; too small and it crawls."
  loss function: "The training objective the model minimizes — a score for how wrong its current predictions are."
  overfitting: "When a model keeps improving on training data while getting worse on unseen data. The default failure mode."
  pinn: "Physics-informed neural network. A network whose loss includes governing-equation residuals and boundary conditions."
  regression: "Predicting a continuous number rather than a category."
  relu: "Rectified Linear Unit, max(0, z). The default hidden-layer activation: cheap, and its gradient survives depth."
  surrogate model: "A fast approximation of a slower high-fidelity simulator, valid only inside the range it was fitted on."
  test set: "Data touched exactly once, at the very end, to report a number. Tune against it and it stops being a test."
  uncertainty: "How much confidence a prediction deserves. A number with no stated range is not a result."
  underfitting: "When a model is too simple or too briefly trained: training and validation error are both high."
  validation set: "Data never trained on, used to decide when to stop and which settings to keep."
  weights: "Learned values that set how much each input contributes to a neuron's output."
  agent: "A name, a role, and written instructions sent to a language model as a system prompt. Not a black box."
  system prompt: "The standing instructions a model receives before your data. In an agent system this is the agent's definition."
  mcp: "Model Context Protocol. A standard way for a model to discover and call tools you host, so the same server works with any client that speaks it."
  orchestration: "The decision about which agents run first, which can run at the same time, and which must wait for others."
  handoff: "One agent passing control to another. Not every framework supports it."
