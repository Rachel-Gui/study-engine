code:  "ARCH 594/508 · AI Seminar & Studio"
title: "AI for Architecture"
subtitle: "Generative AI, agentic AI, machine learning and deep learning for the built environment"

instructor:
  name:  "Narjes Abbasabadi, Ph.D."
  role:  "Assistant Professor"
  dept:  "Department of Architecture · College of Built Environments · University of Washington"
  email: "nabbasab@uw.edu"

voice: "en-GB-RyanNeural"        # any Microsoft neural voice; `edge-tts --list-voices`

# The only place the Pyodide version appears. Bump it here if a lab stops working.
pyodide_url: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"

modules:
  - title: "Course Introduction"
    short: "Introduction"
    question: >
      What is this course about, what will you be able to do, and how do the
      modules connect?
    episodes:
      - intro/0.1-course-introduction.md

  - title: "Module 1 — Coding Foundations"
    short: "Coding Foundations"
    question: >
      How does a laptop that has never run Python become a working setup, and how
      does someone who has never coded learn to read and write the Python this
      course uses?
    episodes:
      - coding/1.1-setup-python.md
      - coding/1.2-python-1-values-and-decisions.md
      - coding/1.3-python-2-collections-and-loops.md
      - coding/1.4-python-3-functions-classes-libraries.md

  - title: "Module 2 — Generative AI"
    short: "Generative AI"
    question: >
      How can generative AI help architects explore design possibilities while
      maintaining meaningful control and architectural judgment?
    objectives:
      - Define generative AI on its own terms and explain what "generate" means as sampling under a condition.
      - Distinguish the major generative model approaches — GANs, VAEs, diffusion, autoregressive/transformer models — and multimodal systems that work across them.
      - Construct a structured architectural prompt and explain why one changed term can affect several visual qualities.
      - Experiment with the control hierarchy — prompt, settings and seed, reference conditioning, structural control, explicit constraints — and compare generations systematically.
      - Distinguish visual plausibility from architectural validity, and say which structured information is needed before simulation or evaluation.
      - Use a language model for text and structured output, and state where human judgment and verification remain necessary.
    episodes:
      - generative/2.1-generative-possibilities.md
      - generative/2.2-noise-to-design.md
      - generative/2.3-prompting-as-design.md
      - generative/2.4-control-the-generator.md
      - generative/2.5-architectural-judgment.md
      - generative/2.6-image-to-architecture.md
      - generative/2.7-guided-design-workflow.md
      - generative/2.8-llms-and-structured-generation.md
      - generative/2.9-run-a-model-locally.md

  - title: "Module 3 — AI-Assisted Coding"
    short: "AI-Assisted Coding"
    question: >
      When a language model writes the code, what is left for the architect to do —
      and why is that the part that matters?
    episodes:
      - vibe-coding/3.1-what-changes-when-ai-writes-code.md
      - vibe-coding/3.2-code-as-design-medium.md
      - vibe-coding/3.3-claude-code-on-your-own-model.md
      - vibe-coding/3.4-workshop-vibe-code-a-design-tool.md

  - title: "Module 4 — Agentic AI"
    short: "Agentic AI"
    question: >
      What is an AI agent, concretely, and how do several of them get orchestrated
      into a system that surfaces real design tradeoffs?
    episodes:
      - agentic/4.1-what-is-an-agent.md
      - agentic/4.2-orchestration.md
      - agentic/4.3-frameworks.md
      - agentic/4.4-setup-negotiators.md
      - agentic/4.5-negotiators-workshop.md

  - title: "Module 5 — Exploratory Data Analysis"
    short: "Exploratory Data Analysis"
    question: >
      What does a dataset look like before any model touches it, and what can looking
      establish on its own?
    episodes:
      - eda/5.1-looking-before-modelling.md
      - eda/5.2-seeing-the-data.md
      - eda/5.3-putting-numbers-on-it.md

  - title: "Module 6 — Machine Learning"
    short: "Machine Learning"
    question: >
      How can an architectural question be turned into features, a target, and a
      model that is evaluated on data it has never seen?
    episodes:
      - ml/6.1-ml-types.md
      - ml/6.2-statistics.md
      - ml/6.3-regression.md
      - ml/6.4-classification.md
      - ml/6.5-generalization.md
      - ml/6.6-uw-energy-demo.md

  - title: "Module 7 — Deep Learning Foundations"
    short: "Deep Learning Foundations"
    question: >
      How does a network of simple units learn a relationship no formula captures,
      and how do you know whether it learned or memorised?
    episodes:
      - deep-learning/7.1-neuron.md
      - deep-learning/7.2-how-networks-learn.md
      - deep-learning/7.3-generalization.md
      - deep-learning/7.4-appliance-energy-demo.md

  - title: "Module 8 — Advanced Deep Learning for Architecture"
    short: "Advanced Deep Learning"
    question: >
      How can different deep-learning architectures process images, graphs,
      sequences, coordinates, and physical systems?
    episodes:
      - advanced-dl/8.1-cnn.md
      - advanced-dl/8.2-graphs-gnns.md
      - advanced-dl/8.3-sequences-attention.md
      - advanced-dl/8.4-physics-informed.md
      - advanced-dl/8.5-pinn-from-scratch.md

  - title: "Reference"
    short: "Reference"
    episodes:
      - reference/9.1-accuracy-boundaries.md

# Wrap any of these in {{double braces}} anywhere in any episode to get a tooltip.
glossary:
  activation function: "A nonlinear transformation applied to a neuron's weighted sum. Without one, stacked layers collapse into a single linear map."
  backpropagation: "Applying the chain rule backwards through a network to get the gradient of the loss with respect to every weight in one sweep."
  baseline: "The simplest model you compare against. If it wins, use it."
  batch: "A subset of training examples used for one weight update."
  bias: "A learned value added to the weighted sum, shifting the threshold at which a neuron responds."
  classification: "Predicting which of a fixed set of categories a case belongs to."
  cross-validation: "Estimating generalization by rotating which slice of the data is held out."
  data leakage: "When information from the test set reaches the model during training, making the reported score optimistic."
  dropout: "Randomly switching off a fraction of neurons during training so the network cannot depend on any single one."
  early stopping: "Halting training at the epoch where validation loss stopped improving, and keeping those weights."
  epoch: "One complete pass through the training dataset."
  features: "The input variables a model sees at prediction time."
  generalization: "How well a model performs on data it was not trained on. The only performance that matters."
  gnn: "Graph neural network. A neural model that passes messages between connected nodes. A graph on its own is not a GNN."
  hyperparameter: "A setting you choose rather than learn: layer count, learning rate, batch size, dropout rate."
  inr: "Implicit neural representation. Geometry or a field stored as a continuous coordinate-based function rather than a grid or mesh."
  learning rate: "The size of each weight update. Too large and training diverges; too small and it crawls."
  loss function: "The training objective the model minimizes — a score for how wrong its current predictions are."
  overfitting: "When a model keeps improving on training data while getting worse on unseen data. The default failure mode."
  pinn: "Physics-informed neural network. A network whose loss includes governing-equation residuals and boundary conditions."
  regression: "Predicting a continuous number rather than a category."
  relu: "Rectified Linear Unit, max(0, z). The default hidden-layer activation: cheap, and its gradient survives depth."
  surrogate model: "A fast approximation of a slower high-fidelity simulator, valid only inside the range it was fitted on."
  test set: "Data touched exactly once, at the very end, to report a number. Tune against it and it stops being a test."
  uncertainty: "How much confidence a prediction deserves. A number with no stated range is not a result."
  underfitting: "When a model is too simple or too briefly trained: training and validation error are both high."
  validation set: "Data never trained on, used to decide when to stop and which settings to keep."
  weights: "Learned values that set how much each input contributes to a neuron's output."
  agent: "A name, a role, and written instructions sent to a language model as a system prompt. Not a black box."
  system prompt: "The standing instructions a model receives before your data. In an agent system this is the agent's definition."
  mcp: "Model Context Protocol. A standard way for a model to discover and call tools you host, so the same server works with any client that speaks it."
  orchestration: "The decision about which agents run first, which can run at the same time, and which must wait for others."
  handoff: "One agent passing control to another. Not every framework supports it."

  generative model: "A model that learns patterns in data and samples new outputs resembling those patterns. A plausible output is not automatically a valid design."
  distribution: "A description of possible outcomes and how likely they are; a generative model samples possibilities rather than specifying one unique design."
  condition: "Information such as text or an image that steers generation. A language condition is not automatically an enforceable geometric constraint."
  seed: "An initialization for random sampling. Repeating a result also requires the same model and relevant generation settings, not just the same seed."
  guidance: "A sampling setting that changes the influence of conditioning. Its effect depends on the model and pipeline; stronger guidance does not guarantee better architecture."
  negative prompt: "Text describing unwanted qualities to steer a supported generator away from them. It does not enforce architectural correctness."
